spring.application.name=Bookhub-EP3
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${PGHOST}/${PGDATABASE}?sslmode=${PGSSLMODE:require}&channelBinding=${PGCHANNELBINDING:require}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Mantener 'none' para respetar el esquema creado manualmente en Neon
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true